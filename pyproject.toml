[project]
name = "postgrest-auth"
version = "0.2.0"
description = "Password login for PostgREST apps: verify against <schema>.users and mint the JWT PostgREST trusts, in-process."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgrest_auth"]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "pytest",
]
